name: 버그 리포트
description: 재현 가능한 문제를 알려주세요.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        제보해 주셔서 감사합니다. 빠르게 확인할 수 있도록 아래 내용을 작성해 주세요.
  - type: textarea
    id: description
    attributes:
      label: 문제 설명
      description: 어떤 문제가 발생했는지 간결하게 설명해 주세요.
      placeholder: 무엇을 시도했고 어떤 문제가 발생했나요?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 재현 방법
      description: 문제를 다시 발생시킬 수 있는 순서를 작성해 주세요.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대한 동작
      description: 정상이라면 어떻게 동작해야 하나요?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 실행 환경
      description: OS, 브라우저, 기기, 런타임 또는 앱 버전을 작성해 주세요.
      placeholder: 예) Windows 11 / Chrome 128
  - type: textarea
    id: logs
    attributes:
      label: 추가 정보
      description: 스크린샷이나 민감정보를 제거한 로그가 있다면 첨부해 주세요.
  - type: checkboxes
    id: checks
    attributes:
      label: 확인 사항
      options:
        - label: 동일한 문제가 이미 등록되어 있는지 검색했습니다.
          required: true
        - label: 비밀번호, API 키 등 민감정보를 포함하지 않았습니다.
          required: true
