name: 기능 제안
description: 개선 아이디어나 새로운 기능을 제안해 주세요.
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        아이디어를 제안해 주셔서 감사합니다. 해결하려는 문제를 중심으로 작성해 주세요.
  - type: textarea
    id: problem
    attributes:
      label: 해결하려는 문제
      description: 현재 어떤 점이 불편하거나 부족한가요?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 제안하는 해결 방법
      description: 원하는 동작이나 사용자 흐름을 설명해 주세요.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 고려한 대안
      description: 다른 방법을 검토했다면 함께 적어 주세요.
  - type: textarea
    id: context
    attributes:
      label: 추가 정보
      description: 참고 링크, 이미지 또는 예시가 있다면 첨부해 주세요.
  - type: checkboxes
    id: checks
    attributes:
      label: 확인 사항
      options:
        - label: 비슷한 제안이 이미 등록되어 있는지 검색했습니다.
          required: true
